<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №1 - Форма реєстрації</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #0056b3;
            text-align: center;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #0056b3;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            background-color: #0056b3;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            margin-top: 10px;
        }
        input[type="submit"]:hover {
            background-color: #004494;
        }
        footer {
            text-align: center;
            margin-top: 30px;
            color: #6c757d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">&larr; На головну сторінку</a>
    <h1>Лабораторна робота №1</h1>
    <h2>Форма реєстрації користувача</h2>

    <form action="https://webhook.site/" method="POST">
        
        <div class="form-group">
            <label for="firstname">Ім'я:</label>
            <input type="text" id="firstname" name="firstname" required placeholder="Введіть своє ім'я">
        </div>

        <div class="form-group">
            <label for="lastname">Прізвище:</label>
            <input type="text" id="lastname" name="lastname" required placeholder="Введіть своє прізвище">
        </div>

        <div class="form-group">
            <label for="email">Адреса електронної пошти:</label>
            <input type="email" id="email" name="email" required placeholder="example@domain.com">
        </div>

        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" required placeholder="Мінімум 6 символів">
        </div>

        <div class="form-group">
            <label for="confirm_password">Підтвердження паролю:</label>
            <input type="password" id="confirm_password" name="confirm_password" required placeholder="Повторіть пароль">
        </div>

        <div class="form-group">
            <label for="birthdate">Дата народження:</label>
            <input type="date" id="birthdate" name="birthdate">
        </div>

        <div class="form-group">
            <label for="gender">Стать:</label>
            <select id="gender" name="gender">
                <option value="">-- Виберіть стать --</option>
                <option value="male">Чоловіча</option>
                <option value="female">Жіноча</option>
                <option value="other">Інша</option>
            </select>
        </div>

        <input type="submit" value="Зареєструватися">

    </form>
</div>

<footer>
    <p>&copy; 2026 | Глуховцов Максим, ДУІКТ</p>
</footer>

</body>
</html>
